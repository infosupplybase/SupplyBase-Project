spring:
  application:
    name: supplybase-api

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:supplybase}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8
    username: ${DB_USER:root}
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: supplybase-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: "${MAIL_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  # nginx sits in front and sends X-Forwarded-For / X-Forwarded-Proto
  # (nginx/supplybase-api.conf). "native" lets Tomcat read them, but only from
  # a proxy on a private address (nginx / Docker's bridge), so a visitor cannot
  # forge their own address. Without this every request looks like it comes
  # from nginx, and the per-address sign-up limit would be one shared bucket
  # for the whole site. With no such header (local runs) nothing changes.
  forward-headers-strategy: native
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  jwt:
    secret: "${JWT_SECRET:}"
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
    issuer: supplybase-projects

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: "${RAZORPAY_KEY_SECRET:}"
    webhook-secret: "${RAZORPAY_WEBHOOK_SECRET:}"
    currency: INR

  notifications:
    enquiry-recipient: ${ENQUIRY_EMAIL:}

  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: "${BOOTSTRAP_ADMIN_PASSWORD:}"

  booking:
    expiry-hours: ${BOOKING_EXPIRY_HOURS:24}

  storage-root-dir: ${STORAGE_ROOT_DIR:./uploads}

# Interactive API docs (/swagger-ui.html) and the machine-readable spec
# (/v3/api-docs) list every endpoint, including the admin ones, so they are OFF
# unless API_DOCS_ENABLED=true (set it in backend/.env for local development;
# never on the production server).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    in.supplybase.backend: ${LOG_LEVEL:INFO}