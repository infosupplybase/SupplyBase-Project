# nginx reverse proxy for the API, on a VPS. See DEPLOYMENT.md ("Self-host
# on a VPS") for the full setup this belongs to.
#
# Copy to /etc/nginx/sites-available/supplybase-api, symlink into
# sites-enabled, then run certbot --nginx — it edits this file in place to
# add the HTTPS server block, so there is deliberately no "listen 443" here.
#
# Replace api.YOURDOMAIN.com below with your real subdomain first.

server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;

    # Matches spring.servlet.multipart.max-request-size in application.yml —
    # project-document/booking-file uploads go through this proxy too.
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
