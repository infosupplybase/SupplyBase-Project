<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/brand/favicon.png" />

    <title>Supplybase Projects | One Partner. Complete Project.</title>
    <meta
      name="description"
      content="Supplybase Projects — architectural design, civil construction, interior design, finishing and turnkey project execution. Labour + material + project management under one roof."
    />
    <meta name="theme-color" content="#0B0B0D" />
    <link rel="canonical" href="https://www.supplybase.co.in/" />

    <!--
      Link previews (WhatsApp, Facebook, LinkedIn, X).
      og:image and og:url MUST be absolute URLs — a relative path is silently
      ignored by every scraper, which is why the link previewed without a
      picture. Update the domain here if the site ever moves.

      These tags are static, so every page shares this one preview. Per-page
      previews would need server-side rendering or prerendering, which this
      Vite SPA does not do.
    -->
    <meta property="og:site_name" content="Supplybase Projects" />
    <meta property="og:title" content="Supplybase Projects | One Partner. Complete Project." />
    <meta
      property="og:description"
      content="From 3D architectural design to construction and finishing — we provide labour, materials and complete project execution under one roof."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.supplybase.co.in/" />
    <meta property="og:image" content="https://www.supplybase.co.in/assets/brand/logo-full.jpg" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Supplybase Projects logo" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Supplybase Projects | One Partner. Complete Project." />
    <meta
      name="twitter:description"
      content="From 3D architectural design to construction and finishing — we provide labour, materials and complete project execution under one roof."
    />
    <meta name="twitter:image" content="https://www.supplybase.co.in/assets/brand/logo-full.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
