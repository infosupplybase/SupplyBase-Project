<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/brand/favicon.png" />

    <title>Supplybase | One Partner. Complete Project.</title>
    <meta
      name="description"
      content="Supplybase - painting, waterproofing, plumbing, electrical, POP ceiling and interior design. Book a site visit and deal with one accountable team from first look to finish."
    />
    <meta name="theme-color" content="#0B0B0D" />
    <link rel="canonical" href="https://www.supplybase.co.in/" />

    <!--
      Link previews (WhatsApp, Facebook, LinkedIn, X).
      og:image and og:url MUST be absolute URLs — a relative path is silently
      ignored by every scraper, which is why the link previewed without a
      picture. Update the domain here if the site ever moves.

      These tags are static, so every page shares this one preview. Per-page
      previews would need server-side rendering or prerendering, which this
      Vite SPA does not do.
    -->
    <meta property="og:site_name" content="Supplybase" />
    <meta property="og:title" content="Supplybase | One Partner. Complete Project." />
    <meta
      property="og:description"
      content="Painting, waterproofing, plumbing, electrical, POP ceiling and interior design across Mumbai, Navi Mumbai, Thane, Kalyan, Panvel and Pune - labour, materials and execution under one roof."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.supplybase.co.in/" />
    <meta property="og:image" content="https://www.supplybase.co.in/assets/brand/logo-full.jpg" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Supplybase logo" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Supplybase | One Partner. Complete Project." />
    <meta
      name="twitter:description"
      content="Painting, waterproofing, plumbing, electrical, POP ceiling and interior design across Mumbai, Navi Mumbai, Thane, Kalyan, Panvel and Pune - labour, materials and execution under one roof."
    />
    <meta name="twitter:image" content="https://www.supplybase.co.in/assets/brand/logo-full.jpg" />

    <!--
      Business details for search engines (schema.org). Only facts already on
      the site: name, phone, email, region, areas served and opening hours.
      A street address is left out because the site does not publish one;
      add "streetAddress" and "postalCode" under "address" once it does.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "name": "Supplybase",
        "url": "https://www.supplybase.co.in/",
        "logo": "https://www.supplybase.co.in/assets/brand/logo-full.jpg",
        "image": "https://www.supplybase.co.in/assets/brand/logo-full.jpg",
        "description": "Painting, waterproofing, plumbing, electrical, POP ceiling and interior design - site visits and complete project execution under one roof.",
        "telephone": "+917709588422",
        "email": "info.supplybase@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "areaServed": ["Mumbai", "Navi Mumbai", "Thane", "Kalyan", "Panvel", "Pune"],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "09:00",
          "closes": "21:00"
        },
        "sameAs": ["https://www.instagram.com/supplybase_official/"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

        </p>
        <p>
          This website needs JavaScript to book a visit. Please turn it on, or reach us directly:
          call or WhatsApp <a href="tel:+917709588422">+91 77095 88422</a> or write to
          <a href="mailto:info.supplybase@gmail.com">info.supplybase@gmail.com</a>.
        </p>
        <p>
          <a href="/services">Services</a> - <a href="/about">About us</a> -
          <a href="/contact">Contact us</a>
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
